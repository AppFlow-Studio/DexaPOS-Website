name: CI

on:
  push:
    branches: [main, HaydarSaleh-Dev, dexaposwebsite-preview]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  test-a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Run axe smoke tests
        run: npm run test:a11y
      # Blocking: this job must pass for PRs to merge.
      # "No new violations" policy — add to KNOWN_VIOLATIONS in the test
      # file (with a tracking ticket) rather than disabling the check.
